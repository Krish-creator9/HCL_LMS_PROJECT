server:
  port: ${PORT:8081}
spring:
  application:
    name: ordercraft-api
  datasource:
    url: ${ORDERCRAFT_DB_URL:jdbc:mysql://localhost:3306/ordercraft?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${ORDERCRAFT_DB_USER:ordercraft}
    password: ${ORDERCRAFT_DB_PASSWORD:ordercraft-local}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-init-sql: "SET sql_mode=(SELECT REPLACE(@@sql_mode,'ONLY_FULL_GROUP_BY',''))"
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
ordercraft:
  jwt-secret: ${ORDERCRAFT_JWT_SECRET:local-development-secret-change-before-deployment-8f7d1a92}
  token-hours: ${ORDERCRAFT_TOKEN_HOURS:8}
  demo-seed: ${ORDERCRAFT_DEMO_SEED:true}
logging:
  level:
    com.ordercraft: INFO
