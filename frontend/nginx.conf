server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Dynamic DNS resolver prevents nginx startup failure if upstream is not yet resolved
    resolver 1.1.1.1 8.8.8.8 127.0.0.11 valid=30s ipv6=off;

    # Compression
    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Reverse proxy for backend API requests
    location /api/ {
        set $backend "http://backend:8081";
        proxy_pass $backend/api/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Reverse proxy for Swagger documentation
    location /swagger-ui/ {
        set $backend "http://backend:8081";
        proxy_pass $backend/swagger-ui/;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    location /v3/api-docs {
        set $backend "http://backend:8081";
        proxy_pass $backend/v3/api-docs;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
    }

    # Angular SPA routing (redirect all non-file requests to index.html)
    location / {
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
