name: OrderCraft DevOps CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Build Backend (Java 26 / Spring Boot)
  # -------------------------------------------------------------
  backend-ci:
    name: Backend Build & Test
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: ordercraft
          MYSQL_USER: ordercraft
          MYSQL_PASSWORD: ordercraft-local
          MYSQL_ROOT_PASSWORD: root-local-only
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build & Package Backend with Maven
        run: |
          cd backend
          chmod +x mvnw
          ./mvnw clean package -DskipTests

  # -------------------------------------------------------------
  # Job 2: Test & Build Frontend (Angular 22 / TypeScript)
  # -------------------------------------------------------------
  frontend-ci:
    name: Frontend Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: |
          cd frontend
          npm ci

      - name: Build Production Frontend
        run: |
          cd frontend
          npm run build -- --configuration production

  # -------------------------------------------------------------
  # Job 3: Docker Multi-Container Compose Validation
  # -------------------------------------------------------------
  docker-validation:
    name: Docker Build Validation
    needs: [backend-ci, frontend-ci]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config

      - name: Build Container Images
        run: |
          docker compose build
