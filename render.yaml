services:
  # 1. Spring Boot REST API Web Service
  - type: web
    name: ordercraft-backend
    env: docker
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 8081
      - key: ORDERCRAFT_DB_URL
        sync: false
      - key: ORDERCRAFT_DB_USER
        sync: false
      - key: ORDERCRAFT_DB_PASSWORD
        sync: false
      - key: ORDERCRAFT_JWT_SECRET
        generateValue: true
      - key: ORDERCRAFT_DEMO_SEED
        value: "true"

  # 2. Frontend Angular + Nginx Web Service
  - type: web
    name: ordercraft-frontend
    env: docker
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: BACKEND_URL
        value: https://ordercraft-backend-427v.onrender.com
